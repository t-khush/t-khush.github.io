---
layout: default
---
<div class="shell page-shell">
  <div{% if page.image %} class="page-image-layout"{% endif %}>
    <header class="page-header">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
    </header>
    {% if page.image %}
      <figure class="page-portrait">
        <img
          src="{{ page.image | relative_url }}"
          alt="{{ page.image_alt | default: page.title | escape }}"
          {% if page.image_width %}width="{{ page.image_width }}"{% endif %}
          {% if page.image_height %}height="{{ page.image_height }}"{% endif %}
          decoding="async">
      </figure>
    {% endif %}
    <article class="prose">{{ content }}</article>
  </div>
</div>
